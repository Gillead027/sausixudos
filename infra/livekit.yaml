# NÃO usado diretamente pelo container — mantido só como referência legível.
# O compose passa a config de verdade via env var LIVEKIT_CONFIG (ver
# docker-compose.yml, serviço livekit), porque webhook.api_key precisa da
# substituição ${LIVEKIT_API_KEY} do próprio compose, que não acontece dentro
# de um arquivo montado como volume. Se algum dia isso voltar a ser um
# arquivo estático de verdade, o conteúdo é este:
port: 7880
bind_addresses:
  - "0.0.0.0"
log_level: info

# Sinalização HTTP/WebSocket permanece apenas na rede interna Docker em 7880.
# A mídia é publicada diretamente pela VPS em UDP 7882, com fallback TCP 7881.
rtc:
  tcp_port: 7881
  udp_port: 7882
  use_external_ip: true

room:
  auto_create: true
  empty_timeout: 300
  departure_timeout: 20

# Substitui o polling de /api/rooms que existia no cliente web.
webhook:
  api_key: "SEU_LIVEKIT_API_KEY_AQUI"
  urls:
    - http://api:3000/api/livekit/webhook
