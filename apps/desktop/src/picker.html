<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src data:;"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Selecionar compartilhamento</title>
    <link rel="stylesheet" href="picker.css" />
  </head>
  <body>
    <header>
      <div class="picker-icon" aria-hidden="true">▣</div>
      <div>
        <h1>Compartilhar tela</h1>
        <p>Escolha o que você quer transmitir para seus amigos.</p>
      </div>
      <button id="picker-close" type="button" aria-label="Fechar">×</button>
    </header>
    <div id="tabs" class="tabs">
      <button type="button" class="tab active" data-kind="window">Aplicativos</button>
      <button type="button" class="tab" data-kind="screen">Telas</button>
    </div>
    <main id="source-list">
      <p id="status">Carregando fontes…</p>
    </main>
    <div class="options">
      <label>
        <span>Resolução</span>
        <select id="quality-resolution">
          <option value="720">720p</option>
          <option value="1080" selected>1080p</option>
        </select>
      </label>
      <label>
        <span>FPS</span>
        <select id="quality-fps">
          <option value="30">30 FPS</option>
          <option value="60" selected>60 FPS</option>
        </select>
      </label>
      <label class="options-toggle">
        <span>
          <strong>Compartilhar áudio</strong>
          <small>Compartilha o áudio do aplicativo/guia</small>
        </span>
        <input id="share-audio" type="checkbox" checked />
      </label>
    </div>
    <footer>
      <button id="cancel" type="button" class="btn-secondary">Cancelar</button>
      <button id="confirm" type="button" class="btn-primary" disabled>Transmitir</button>
    </footer>
    <script src="../renderer-dist/picker-renderer.global.js"></script>
  </body>
</html>
